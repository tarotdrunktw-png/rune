    <style>
        :root {
            --panel-bg: rgba(21, 24, 33, 0.85);
            --card-bg: rgba(26, 28, 36, 0.9);
            --inner-bg: rgba(19, 22, 31, 0.9);
            --tarot-bg: rgba(26, 30, 43, 0.9);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #d97706;
            --accent-hover: #f59e0b;
            --upright: #2ecc71;
            --reversed: #f43f5e;

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft JhengHei", "Heiti TC", sans-serif; }
        
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0d0f14;

            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-main);
            overflow: hidden;
            position: relative;

        body::before {
            content: "";

            top: 0;
            left: 0;

            height: 100vh;
            background: rgba(13, 15, 20, 0.4);
            backdrop-filter: blur(4px);

            background-color: var(--panel-bg);

            flex-direction: column;

<body>

    <div class="app-layout">

        🍸 載入訪客數中...

    <script>
        // ⚠️ 請記得替換為您剛剛複製出來結尾為 /exec 的新網址！
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzjbp5kysXhYb8SXWfrbdA75sc-GaVh1dcPE2cdO8ILvFG3fRNVpocwCHImVPWnj-nFhQ/exec";

        let customCount = 3;
        let currentEmail = localStorage.getItem('rune_email') || "";
        let currentPassword = localStorage.getItem('rune_password') || "";
        let currentUsername = localStorage.getItem('rune_username') || "";

        window.onload = function() {
            initCounter();
            updateUserDisplay();
        };

        // 核心突破：完美繞過 GAS 302 跳轉丟失資料的通訊幫手函式
        async function sendGasRequest(payload) {
            const formData = new URLSearchParams();
            formData.append("payload", JSON.stringify(payload));
            
            try {
                let res = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData.toString()
                });
                return await res.json();
            } catch (err) {
                console.error("連線錯誤：", err);
                return { status: "error", message: "網路連線異常，請稍後再試。" };
            }
        }

        function promptFreeCount() {
            let input = prompt("請輸入自訂抽牌張數 (1 - 9)：", customCount);
            if (input !== null) {
                let val = parseInt(input);

                    customCount = val;

        async function loadCloudHistory() {
            if (!currentEmail || !currentPassword) {
                let wantLogin = confirm("💡 檢視雲端紀錄需要先登入您的帳號。\n\n是否立即前往登入頁面？");
                if (wantLogin) { showLoginPage(); }
                return;
            }

            let body = document.getElementById("historyBody");
            let displayName = currentUsername ? currentUsername : currentEmail;
            document.getElementById("historyTitle").textContent = `📂 [ ${displayName} ] 的占卜紀錄`;
            body.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px;">正在載入您的專屬紀錄...</div>';
            document.getElementById("historyModal").style.display = "flex";

            try {
                let passwordHash = hashPassword(currentPassword);
                let response = await fetch(`${GAS_URL}?email=${encodeURIComponent(currentEmail)}&passHash=${encodeURIComponent(passwordHash)}`);
                let data = await response.json();
                let html = "";

                if (data.length === 0) {
                    body.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px;">尚無您的雲端紀錄</div>';
                    return;
                }

                data.reverse().forEach((item) => {
                    try {
                        let bytes = CryptoJS.AES.decrypt(item.encryptedPayload, currentPassword);
                        let decrypted = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));

                        html += `
                            <div class="history-item" onclick="showPreviewImage('${decrypted.image}')">
                                <div>
                                    <div style="font-weight:bold; color:#fbbf24;">${decrypted.spreadName}</div>
                                    <div style="color:#94a3b8; font-size:10px;">${new Date(item.date).toLocaleString()}</div>
                                </div>
                                <div style="color:#38bdf8;">👁️ 檢視圖面</div>
                            </div>
                        `;
                    } catch(e) { console.error("解密失敗", e); }
                });
                body.innerHTML = html;
            } catch(e) {
                console.error("載入歷史紀錄失敗", e);
                body.innerHTML = '<div style="text-align:center; color:#f43f5e; padding:20px;">載入失敗</div>';
            }
        }

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getRandomRunes(count) {
            let shuffled = shuffle(RUNE_DECK);
            let result = [];
            for(let i=0; i<count; i++) {
                let rune = {...shuffled[i]};
                if (rune.hasReversed) {
                    rune.isReversed = Math.random() < 0.4;
                    rune.orientation = rune.isReversed ? "逆位 (Reversed)" : "正位 (Upright)";
                    rune.interpretation = rune.isReversed ? rune.reversed : rune.upright;
                } else {
                    rune.isReversed = false;
                    rune.orientation = "正位 (Symmetric)";
                    rune.interpretation = rune.upright;
                }
                result.push(rune);
            }
            return result;
        }

        function createRuneBoxHtml(rune, posTitle) {
            let badgeClass = !rune.hasReversed ? "bg-symmetric" : (rune.isReversed ? "bg-rev" : "bg-up");
            let symbolClass = rune.isReversed ? "rune-symbol-box reversed-rune" : "rune-symbol-box";

            let html = '<div class="card-box">';
            if (posTitle) { html += '<div class="banner">' + posTitle + '</div>'; }
            html += '<div class="content"><div class="rune-frame"><div class="t-head">【盧恩符文·能量解讀】</div><div class="t-body">';
            html += '<div class="' + symbolClass + '">' + rune.symbol + '</div>';
            html += '<div class="t-info"><div class="card-name">' + rune.name + '</div><div class="card-theme">▸ 核心元素：' + rune.element + '</div>';
            html += '<div class="interp-box">▸ 意涵：' + rune.interpretation + '</div></div></div></div>';
            html += '<div class="footer-frame"><span class="orientation-badge ' + badgeClass + '">' + rune.orientation + '</span></div></div></div>';
            return html;
        }

        function createMiniRuneHtml(rune, titleText) {
            let revClass = rune.isReversed ? "reversed-mini" : "";
            return `
                <div class="mini-card">
                    <div class="mini-title">${titleText}</div>
                    <div class="mini-symbol ${revClass}">${rune.symbol}</div>
                    <div class="mini-name">${rune.name.split(' ')[0]}</div>
                </div>
            `;
        }

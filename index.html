<body>

    <div class="app-layout">
        <div class="control-panel">
            <div class="title">🍸 醉酒塔羅 🔮 盧恩符文占卜系統</div>
            <div class="control-row">
                <div class="config-box">
                    <span>選擇牌陣:</span>
                    <select id="spreadSelect" onchange="toggleSpreadConfig()">
                        <option value="single">🔮 單符文每日指引</option>
                        <option value="triple">⚖️ 三符文過去現在未來</option>
                        <option value="cross5">✝️ 五符文十字交叉法</option>
                        <option value="norns">📜 諾倫三女神命運流轉</option>
                        <option value="free">🎲 自由抽牌張數</option>
                    </select>
                </div>

                <div class="config-box" id="freeConfigBox" style="display: none;" onclick="promptFreeCount()">
                    <span>張數:</span>
                    <span id="freeCountDisplay" style="color: #fff; font-weight: bold;">3</span>
                </div>

                <button onclick="executeDraw()">✨ 開始占卜</button>
            </div>
        </div>

        <div class="workspace">
            <div id="spreadArea" class="spread-container">
                <div class="welcome-box">
                    <div class="welcome-title">✨ 歡迎來到 醉酒塔羅 - 盧恩符文系統 ✨</div>
                    <div class="welcome-subtitle">✨ 請點擊上方選單與按鈕開始進行占卜 ✨</div>
                    <div class="welcome-instructions">
                        <div class="welcome-instructions-title">使用方式：</div>
                        <div>1. 深呼吸三次，讓心靈沉澱</div>
                        <div>2. 閉上雙眼，在心中默念您的問題</div>
                        <div>3. 於上方選單挑選占卜法，按下「開始占卜」</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 手機長按儲存截圖彈窗 -->
    <div id="screenshotModal" class="screenshot-modal" onclick="this.style.display='none'">
        <div class="screenshot-tip">👆 請長按下方圖片選擇「加入照片」或「儲存影像」</div>
        <img id="screenshotResultImg" alt="占卜結果截圖" onclick="event.stopPropagation()">
        <button class="action-btn secondary" onclick="document.getElementById('screenshotModal').style.display='none'">關閉預覽</button>
    </div>

    <div class="brand-footer">
        <span class="brand-name">醉酒塔羅 - 李特</span>
        <a href="https://www.threads.net/@tarot.drunk" target="_blank" class="brand-threads">@tarot.drunk</a>
    </div>

    <div class="visitor-counter-bar" id="visitorCount">
        🍸 載入訪客數中...
    </div>

    <script>
        let customCount = 3;

        function promptFreeCount() {
            let input = prompt("請輸入自訂抽牌張數 (1 - 9)：", customCount);
            if (input !== null) {
                let val = parseInt(input);
                if (!isNaN(val) && val >= 1 && val <= 9) {
                    customCount = val;
                    document.getElementById("freeCountDisplay").textContent = customCount;
                } else {
                    alert("請輸入有效的數字 (1 到 9 之間)");
                }
            }
        }

        async function initCounter() {
            try {
                let endpoint = 'https://abacus.jasoncameron.dev/get/tarotdrunktw-png.github.io/rune-visits';
                if (!sessionStorage.getItem('rune_counted')) {
                    endpoint = 'https://abacus.jasoncameron.dev/hit/tarotdrunktw-png.github.io/rune-visits';
                    sessionStorage.setItem('rune_counted', 'true');
                }
                let response = await fetch(endpoint);
                let data = await response.json();
                document.getElementById('visitorCount').textContent = `🍸 歡迎來到醉酒塔羅，您是第：${data.value} 位深夜酒客`;
            } catch (e) {
                console.error("計數器載入失敗", e);
                document.getElementById('visitorCount').textContent = `🍸 歡迎來到醉酒塔羅`;
            }
        }

        initCounter();

        function toggleSpreadConfig() {
            let spreadVal = document.getElementById("spreadSelect").value;
            let freeBox = document.getElementById("freeConfigBox");
            if (spreadVal === "free") {
                freeBox.style.display = "flex";
            } else {
                freeBox.style.display = "none";
            }
        }

        function executeDraw() {
            let spreadVal = document.getElementById("spreadSelect").value;
            if (spreadVal === "single") drawSingle();
            else if (spreadVal === "triple") drawTriple();
            else if (spreadVal === "cross5") drawCross5();
            else if (spreadVal === "norns") drawNorns();
            else if (spreadVal === "free") drawFreeSpread();
        }

        // 完整 25 盧恩符文庫（已依要求將無正逆位的 8 枚符文標記 hasReversed: false）
        const RUNE_DECK = [

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getRandomRunes(count) {
            let shuffled = shuffle(RUNE_DECK);
            let result = [];
            for(let i=0; i<count; i++) {
                let rune = {...shuffled[i]};
                // 嚴格遵循：只有支援正逆位的符文才隨機決定正逆位，無正逆位的 8 枚強制純正位
                if (rune.hasReversed) {
                    rune.isReversed = Math.random() < 0.4;
                    rune.orientation = rune.isReversed ? "逆位 (Reversed)" : "正位 (Upright)";
                    rune.interpretation = rune.isReversed ? rune.reversed : rune.upright;
                } else {
                    rune.isReversed = false;
                    rune.orientation = "正位 (Symmetric)";
                    rune.interpretation = rune.upright;
                }
                result.push(rune);
            }
            return result;
        }

        function createRuneBoxHtml(rune, posTitle) {
            let badgeClass;
            if (!rune.hasReversed) {
                badgeClass = "bg-symmetric";
            } else {
                badgeClass = rune.isReversed ? "bg-rev" : "bg-up";
            }
            let symbolClass = rune.isReversed ? "rune-symbol-box reversed-rune" : "rune-symbol-box";
            
            let html = '<div class="card-box">';
            if (posTitle) {
                html += '<div class="banner">' + posTitle + '</div>';
            }
            html += '<div class="content">';
            html += '<div class="rune-frame">';
            html += '<div class="t-head">【盧恩符文·能量解讀】</div>';
            html += '<div class="t-body">';
            html += '<div class="' + symbolClass + '">' + rune.symbol + '</div>';
            html += '<div class="t-info">';
            html += '<div class="card-name">' + rune.name + '</div>';
            html += '<div class="card-theme">▸ 核心元素：' + rune.element + '</div>';
            html += '<div class="interp-box">▸ 意涵：' + rune.interpretation + '</div>';
            html += '</div></div></div>';
            html += '<div class="footer-frame"><span class="orientation-badge ' + badgeClass + '">' + rune.orientation + '</span></div>';
            html += '</div></div>';
            return html;
        }

        function createMiniRuneHtml(rune, titleText) {
            let revClass = rune.isReversed ? "reversed-mini" : "";
            return `
                <div class="mini-card">
                    <div class="mini-title">${titleText}</div>
                    <div class="mini-symbol ${revClass}">${rune.symbol}</div>
                    <div class="mini-name">${rune.name.split(' ')[0]}</div>
                </div>
            `;
        }

        // 截圖功能：動態加入全版面密集斜向交錯浮水印
        function captureSpread() {
            let target = document.getElementById("spreadArea");
            let btnGroup = document.querySelector(".action-btn-group");
            if(btnGroup) btnGroup.style.display = "none";

            let totalHeight = Math.max(target.scrollHeight, 500);
            let watermarkContainer = document.createElement("div");
            watermarkContainer.className = "screenshot-watermark-container";
            watermarkContainer.style.height = totalHeight + "px";

            let count = Math.ceil(totalHeight / 100) * 3;
            for(let i = 0; i < count; i++) {
                let item = document.createElement("div");
                item.className = "watermark-item";
                item.textContent = "🍸 醉酒塔羅 - 李特 @tarot.drunk";
                watermarkContainer.appendChild(item);
            }
            target.appendChild(watermarkContainer);

            html2canvas(target, {
                backgroundColor: "#0d0f14",
                scale: window.innerWidth < 768 ? 2.5 : 2, 
                useCORS: true,
                logging: false,
                windowHeight: totalHeight
            }).then(canvas => {
                target.removeChild(watermarkContainer);
                if(btnGroup) btnGroup.style.display = "flex";

                let dataUrl = canvas.toDataURL("image/png");
                let isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);
                
                if (isMobile) {
                    document.getElementById("screenshotResultImg").src = dataUrl;
                    document.getElementById("screenshotModal").style.display = "flex";
                } else {
                    let link = document.createElement("a");
                    link.download = "醉酒塔羅-盧恩占卜結果.png";
                    link.href = dataUrl;
                    link.click();
                }
            }).catch(err => {
                if(watermarkContainer.parentNode) target.removeChild(watermarkContainer);
                if(btnGroup) btnGroup.style.display = "flex";
                console.error("截圖失敗", err);
                alert("截圖產生失敗，請稍後再試");
            });
        }
